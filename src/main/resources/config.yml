# รหัสผ่านเซิร์ฟเวอร์เริ่มต้น (ความยาว 1-8 ตัวอักษรหรือตัวเลข)
server-password: "12345678"

# 🌟 ระบบจดจำผู้เล่น (ใส่รหัสผ่านครั้งเดียว ครั้งถัดไปไม่ต้องใส่อีกเลย)
# เหมาะที่สุดสำหรับสตรีมเมอร์: ใส่รหัสนอกสตรีมเพียงครั้งเดียว
# ครั้งต่อไปเวลาเปิดสตรีมสดเข้าเล่น จะเข้าเซิร์ฟเวอร์ได้ทันที 100% ไม่มีอะไรขึ้นหน้าจอเลย!
remember-player:
  # เปิดใช้งานระบบจดจำผู้เล่น
  enabled: true
  # หากแอดมินเปลี่ยนรหัสผ่านเซิร์ฟเวอร์ (/serverpass set) ให้รีเซ็ตทุกคนเพื่อให้ใส่รหัสใหม่หรือไม่
  # true = เมื่อเปลี่ยนรหัส ผู้เล่นทุกคนจะต้องใส่รหัสใหม่ครั้งแรกอีก 1 ครั้ง
  # false = ผู้เล่นที่เคยผ่านแล้ว ไม่ต้องใส่ใหม่แม้จะเปลี่ยนรหัส
  reset-on-password-change: true

# รูปแบบการใส่รหัส (สำหรับผู้เล่นที่ยังไม่เคยยืนยัน):
# "CHAT" = พิมพ์ในช่องแชตโดยตรง (กด T แล้วพิมพ์รหัสได้เลย)
# "GUI"  = เมนูตู้เซฟ Keypad GUI
input-mode: "CHAT"

# การตั้งค่าความเนียน (สำหรับครั้งแรกที่ต้องใส่รหัส)
stealth:
  # ล้างหน้าจอแชตของผู้เล่นทันทีหลังกดส่งรหัส เพื่อไม่ให้รหัสค้างอยู่ในประวัติแชต
  clear-chat-on-submit: true

  # เอฟเฟกต์จอมืด (Blindness):
  # false = จอสว่างปกติ (ภาพสวยเป็นธรรมชาติ สตรีมเมอร์ไลฟ์สดคนดูไม่สงสัย)
  # true  = จอมืดดำสนิท
  blindness: false

  # ล็อกตัวผู้เล่น (Freeze ตำแหน่ง ไม่ให้เดินหรือกระโดดก่อนใส่รหัส)
  freeze: true

  # รูปแบบการแสดงคำเตือนให้ใส่รหัส:
  # "ACTIONBAR" = แสดงเป็นแถบข้อความเล็กๆ เหนือหลอดเลือด (เนียนที่สุด)
  # "TITLE"     = ตัวหนังสือกลางจอ
  # "CHAT"      = ส่งข้อความแจ้งในแชต
  # "NONE"      = ไม่แสดงอะไรเลย (เนียน 100%)
  prompt-type: "ACTIONBAR"

# จำนวนครั้งที่ให้โอกาสกรอกรหัสผิด ก่อนจะเตะออกจากเซิร์ฟเวอร์
max-attempts: 3

# เวลาที่ให้ผู้เล่นกรอกรหัส (หน่วย: วินาที) หากหมดเวลาจะถูกเตะ
timeout-seconds: 60

# การตั้งค่าหน้าต่าง Virtual Keypad GUI (กรณีเลือกโหมด GUI หรือใช้คำสั่ง /serverpass gui)
gui:
  enabled: false
  title: "&8» &6ใส่รหัสผ่านเซิร์ฟเวอร์ &8«"
  mask-char: "*"

# ข้อความแจ้งเตือนต่างๆ (รองรับรหัสสี & และ §)
messages:
  prefix: "&8[&6ServerPass&8] "
  actionbar-prompt: "&eกรุณาพิมพ์รหัสผ่านในช่องแชตเพื่อเข้าเล่น..."
  prompt-chat: "&eพิมพ์รหัสผ่านเซิร์ฟเวอร์ในช่องแชตได้ทันที (ข้อความของคุณจะไม่ถูกเผยแพร่)"
  wrong-password: "&cรหัสผ่านไม่ถูกต้อง! &7(เหลือโอกาสอีก &e{remaining} &7ครั้ง)"
  kick-wrong: "&c[ServerPassword] คุณใส่รหัสผ่านผิดเกินจำนวนครั้งที่กำหนด!"
  kick-timeout: "&c[ServerPassword] หมดเวลาในการใส่รหัสผ่านเซิร์ฟเวอร์!"
  success: "&a✔ ยืนยันรหัสผ่านถูกต้อง! ยินดีต้อนรับเข้าสู่เซิร์ฟเวอร์"
  title-success: "&a✔ ยืนยันสำเร็จ"
  subtitle-success: "&eยินดีต้อนรับสู่เซิร์ฟเวอร์!"
  actionbar-success: "&a✔ ยืนยันรหัสผ่านถูกต้อง! ยินดีต้อนรับ"
  admin-reload: "&aโหลดการตั้งค่า config.yml ใหม่เรียบร้อยแล้ว!"
  admin-set-success: "&aเปลี่ยนรหัสผ่านเซิร์ฟเวอร์เป็น: &e{password}"
  admin-invalid-length: "&cรหัสผ่านต้องมีความยาว 1 ถึง 8 ตัวอักษร/ตัวเลขเท่านั้น!"
  already-authenticated: "&aคุณได้ใส่รหัสผ่านเซิร์ฟเวอร์เรียบร้อยแล้ว"
